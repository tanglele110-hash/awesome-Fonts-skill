const categories={all:'字体样张',sans:'黑体',serif:'宋体 / 仿宋',kai:'楷体',rounded:'圆体',handwritten:'手写 / 书法'};
const gallery=document.querySelector('.gallery'), search=document.querySelector('#search');
let category='all', tags=new Set(), frame=0, toastTimer;
const icon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M14 3h7v7M21 3 10 14M10 3H4a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-6"/></svg>';
const nodes=fonts.map(font=>{
 const card=document.createElement('article');card.className='card';card.dataset.id=font.id;
 const link=document.createElement('a');link.className='card-link';link.href=font.source.url;link.target='_blank';link.rel='noopener noreferrer';link.setAttribute('aria-label',font.name+' · '+font.variant+' · 查看字体来源');
 const heading=document.createElement('h3');heading.className='sr-only';heading.textContent=font.name;link.append(heading);
 const crop=document.createElement('span');crop.className='specimen';const c=font.crop;crop.style.aspectRatio=c.width+'/'+c.height;
 const img=document.createElement('img');img.src=font.image;img.alt=font.name+'：'+font.sampleText.replaceAll('\n','，');img.decoding='async';img.loading='lazy';img.width=font.sheetWidth*2;img.height=font.sheetHeight*2;
 img.style.width=font.sheetWidth/c.width*100+'%';img.style.left=-c.x/c.width*100+'%';img.style.top=-c.y/c.height*100+'%';crop.append(img);link.append(crop);card.append(link);
 const actions=document.createElement('div');actions.className='card-actions';
 const copy=document.createElement('button');copy.type='button';copy.textContent='复制字体名';copy.setAttribute('aria-label','复制字体名称 '+font.name);copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(font.family);toast('已复制 '+font.family);}catch{toast('无法访问剪贴板，请复制：'+font.family);}});
 const source=document.createElement('a');source.href=font.source.url;source.target='_blank';source.rel='noopener noreferrer';source.innerHTML=icon+'字体来源';source.setAttribute('aria-label',font.name+' · 字体来源');actions.append(copy,source);card.append(actions);return {font,card};
});
function toast(message){const box=document.querySelector('.toast');box.textContent=message;box.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{box.hidden=true},3500);}
function layout(){cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{
 const cards=[...gallery.children];if(!cards.length){gallery.style.height='0px';return;}
 const style=getComputedStyle(gallery),columns=Number(style.getPropertyValue('--columns')),gap=parseFloat(style.gap),width=(gallery.clientWidth-gap*(columns-1))/columns;
 gallery.classList.add('ready');cards.forEach(card=>{card.style.width=width+'px';});const heights=Array(columns).fill(0);
 cards.forEach((card,i)=>{const column=i%columns;card.style.left=column*(width+gap)+'px';card.style.top=heights[column]+'px';heights[column]+=card.getBoundingClientRect().height+gap;});gallery.style.height=Math.max(0,Math.max(...heights)-gap)+'px';
});}
function render(){const q=search.value.trim().toLocaleLowerCase();const result=nodes.filter(({font:f})=>(category==='all'||f.category===category)&&[...tags].every(t=>f.tags.includes(t))&&[f.name,f.family,f.variant,...f.tags].join(' ').toLocaleLowerCase().includes(q));
 gallery.replaceChildren(...result.map(n=>n.card));document.querySelector('#count').textContent=result.length+' 款字体';document.querySelector('#category-title').textContent=categories[category];document.querySelector('.empty').hidden=result.length>0;document.querySelector('#reset').hidden=category==='all'&&!tags.size&&!q;
 document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===category)));document.querySelectorAll('[data-tag]').forEach(b=>b.setAttribute('aria-pressed',String(tags.has(b.dataset.tag))));layout();
}
document.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.category;render();}));document.querySelectorAll('[data-tag]').forEach(b=>b.addEventListener('click',()=>{const t=b.dataset.tag;tags.has(t)?tags.delete(t):tags.add(t);render();}));
function reset(){category='all';tags.clear();search.value='';render();}
document.querySelector('#reset').addEventListener('click',reset);document.querySelector('#empty-reset').addEventListener('click',reset);search.addEventListener('input',render);new ResizeObserver(layout).observe(gallery);render();
</script></body></html>
